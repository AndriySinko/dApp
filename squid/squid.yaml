manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0x9e618ad621dA6F5b7f83a06b4f8162F0214cA430"
      GOVERNANCE_ADDRESS: "0xe070A7dfcd38299AB7250aC103C2cbF3f779EEc2"
      REPUTATION_ADDRESS: "0x6b514227FA310b3055e3ec8e2F86e2E7A9039875"
      START_BLOCK: "10837670"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
