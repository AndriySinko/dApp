manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0x270856554d11E79CcfD483b540FB4735D8aD97e9"
      GOVERNANCE_ADDRESS: "0xef4119a233399039d4598374c9E09C82C4a421C8"
      REPUTATION_ADDRESS: "0xdDB8e1BE54a66Dd693160E5AceE79a5CF1368969"
      START_BLOCK: "10830000"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
