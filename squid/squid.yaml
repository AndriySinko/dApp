manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0x5E83F77788277DB27878D983ce58A94EeA378990"
      GOVERNANCE_ADDRESS: "0xE7538380908E8E46Fe7C5bcBf60C1B5fc4b32b15"
      REPUTATION_ADDRESS: "0xCc49e14309Cd94835F302bc47B8D396543EB1b3A"
      START_BLOCK: "10841088"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
