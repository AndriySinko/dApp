manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0x72a9E77C2B95b6BB096e66bA08e6A2B826d48191"
      GOVERNANCE_ADDRESS: "0x3217180ddbFc06B6f331dd986159f4E6ABE77c60"
      REPUTATION_ADDRESS: "0x30A4dEA4Aa89c6005b7FBFbCBcc3329756C7D3cd"
      START_BLOCK: "10840734"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
