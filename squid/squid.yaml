manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0x861C75C51e786A78d1C26c980500F9d94a71dBab"
      GOVERNANCE_ADDRESS: "0x23657F62fE428FBab44B569F13711555C0Ed0a13"
      REPUTATION_ADDRESS: "0x645B9F9c10Ed7FbE9f26E4CdD9bEa5e02273A0b6"
      START_BLOCK: "10839760"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
