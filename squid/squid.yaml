manifest_version: subsquid.io/v0.1

name: pact-squid
version: 1
description: "PACT protocol indexer — challenges, bets, reputation, governance"

build:

deploy:
  addons:
    postgres:
  processor:
    cmd:
      - node
      - lib/processor.js
    env:
      FACTORY_ADDRESS: "0xEe4BD2DF1A4bEeE95B2f2a4294aC5505D2c4E63A"
      GOVERNANCE_ADDRESS: "0x357b38fb575Efb7C87B5ae3624ae1BA364612C1b"
      REPUTATION_ADDRESS: "0x91Eb85782fe19056f4EC8837e2B66fb5650CB782"
      START_BLOCK: "10840000"
      SEPOLIA_RPC_URL: ${{secrets.SEPOLIA_RPC_URL}}
  api:
    cmd:
      - npx
      - squid-graphql-server

scale:
  dedicated: false
